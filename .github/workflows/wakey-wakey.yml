name: Wakey Wakey
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wakey-wakey
  cancel-in-progress: false
jobs:
  keep-projects-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check and wake all Supabase projects except excluded ones
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_EXCLUDED_PROJECT_REFS: ${{ vars.SUPABASE_EXCLUDED_PROJECT_REFS || 'hplzeriwlfhxtsbyojjj' }}
          SUPABASE_DB_PASSWORDS: ${{ secrets.SUPABASE_DB_PASSWORDS }}
          SUPABASE_DB_HOSTS: ${{ secrets.SUPABASE_DB_HOSTS }}
          SUPABASE_DB_PORT: ${{ vars.SUPABASE_DB_PORT || '5432' }}
          RESTORE_INACTIVE_PROJECTS: "true"
        run: python main.py
