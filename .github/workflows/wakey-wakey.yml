name: Wakey Wakey

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs during high load.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wakey-wakey
  cancel-in-progress: false

jobs:
  keep-projects-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Wakey Wakey
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORDS: ${{ secrets.SUPABASE_DB_PASSWORDS }}
          SUPABASE_DB_HOSTS: ${{ secrets.SUPABASE_DB_HOSTS }}
          SUPABASE_DB_PORT: ${{ vars.SUPABASE_DB_PORT }}
          RESTORE_INACTIVE_PROJECTS: ${{ vars.RESTORE_INACTIVE_PROJECTS }}
        run: python main.py
